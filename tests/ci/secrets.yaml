# CI-only indirection. GitHub Actions supplies fresh ephemeral values for every
# build; this file contains no deployable credential.
wifi_ssid: !env_var CI_WIFI_SSID
wifi_password: !env_var CI_WIFI_PASSWORD
wifi_ssid_backup1: !env_var CI_WIFI_SSID_BACKUP1
wifi_password_backup1: !env_var CI_WIFI_PASSWORD_BACKUP1
wifi_ssid_backup2: !env_var CI_WIFI_SSID_BACKUP2
wifi_password_backup2: !env_var CI_WIFI_PASSWORD_BACKUP2
api_encryption_key: !env_var CI_API_ENCRYPTION_KEY
ota_password: !env_var CI_OTA_PASSWORD
fallback_ap_password: !env_var CI_FALLBACK_AP_PASSWORD

wifi_config: "wifi.local.yaml"
wireguard_config: "wireguard.local.yaml"

makeskyblue_monitor_wireguard_private_key: !env_var CI_WIREGUARD_PRIVATE_KEY
makeskyblue_monitor_wireguard_address: "192.0.2.49"
makeskyblue_monitor_wireguard_endpoint: !env_var CI_WIREGUARD_ENDPOINT
makeskyblue_monitor_wireguard_peer_public_key: !env_var CI_WIREGUARD_PEER_PUBLIC_KEY
makeskyblue_monitor_wireguard_preshared_key: !env_var CI_WIREGUARD_PRESHARED_KEY
