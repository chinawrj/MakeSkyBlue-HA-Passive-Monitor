switch:
  - platform: template
    id: direct_mode_permanent_request
    name: "PREVIEW Arm Direct Mode Permanently"
    icon: mdi:lock-alert
    entity_category: config
    optimistic: false
    lambda: return id(direct_mode_requested);
    turn_on_action:
      - lambda: |-
          if (!id(direct_mode_requested)) {
            id(direct_mode_requested) = true;
            direct_mode_preview::direct_mode_gate.arm_permanently();
            ESP_LOGW("direct_preview",
                     "Direct mode permanently requested; waiting for 30s UART idle. Preview firmware has no TX path");
          }
    turn_off_action:
      - lambda: |-
          id(direct_mode_requested) = true;
          direct_mode_preview::direct_mode_gate.arm_permanently();
          id(direct_mode_permanent_request).publish_state(true);
          ESP_LOGW("direct_preview",
                   "Direct mode request is one-way and cannot be disabled from HA");

