  - platform: template
    name: "G1 Parser Buffered Bytes"
    icon: mdi:buffer
    entity_category: diagnostic
    accuracy_decimals: 0
    update_interval: 30s
    lambda: return passive_modbus::monitor.stream_buffered_bytes(1);
  - platform: template
    name: "G2 Parser Buffered Bytes"
    icon: mdi:buffer
    entity_category: diagnostic
    accuracy_decimals: 0
    update_interval: 30s
    lambda: return passive_modbus::monitor.stream_buffered_bytes(2);
  - platform: template
    name: "Last UART Frame Age"
    icon: mdi:timer-sand
    entity_category: diagnostic
    unit_of_measurement: s
    accuracy_decimals: 1
    update_interval: 10s
    lambda: |-
      const uint32_t last = passive_modbus::monitor.last_frame_ms();
      if (last == 0U) return {};
      return static_cast<float>(millis() - last) / 1000.0f;
  - platform: template
    name: "UART Capture Events Sent"
    icon: mdi:send-check-outline
    entity_category: diagnostic
    accuracy_decimals: 0
    update_interval: 30s
    lambda: return id(capture_event_send_count);
  - platform: template
    name: "UART Capture Event Retries"
    icon: mdi:repeat
