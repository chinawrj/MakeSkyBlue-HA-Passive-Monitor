uart:
  - id: uart_monitor_g1
    rx_pin:
      number: GPIO1
      mode:
        input: true
        pullup: false
        pulldown: false
    baud_rate: ${monitor_baud_rate}
    data_bits: ${monitor_data_bits}
    parity: ${monitor_parity}
    stop_bits: ${monitor_stop_bits}
    rx_buffer_size: 2048
    rx_full_threshold: 1
    rx_timeout: 1
    debug:
      direction: RX
      dummy_receiver: true
      after:
        bytes: ${monitor_chunk_size}
        timeout: ${monitor_frame_timeout}
      sequence:
        - lambda: |-
            const uint32_t sequence = ++id(capture_sequence);
            const uint32_t now = millis();
            id(g1_chunk_count)++;
            id(g1_byte_count) += bytes.size();
            modbus_capture::ring.push_uart(1, sequence, now, bytes);
            passive_modbus::monitor.feed(1, sequence, now, bytes);
            direct_mode_preview::direction_detector.feed(1, now, bytes);
            direct_mode_preview::direct_mode_gate.note_uart_activity(now);
            id(led_activity_until_ms) = now + 180;

            static const char HEX[] = "0123456789ABCDEF";
            std::string payload;
            payload.reserve(bytes.size() * 2);
            for (const uint8_t value : bytes) {
              payload.push_back(HEX[value >> 4]);
              payload.push_back(HEX[value & 0x0F]);
            }

            id(last_g1_chunk).publish_state(
              str_sprintf("boot=%u #%u %uB %s",
                          static_cast<unsigned>(id(capture_boot_id)),
                          static_cast<unsigned>(sequence),
                          static_cast<unsigned>(bytes.size()), payload.c_str())
            );
            ESP_LOGI("modbus_raw", "boot=%u #%u G1/GPIO1 %uB RAW_HEX=%s",
                     static_cast<unsigned>(id(capture_boot_id)),
                     static_cast<unsigned>(sequence),
                     static_cast<unsigned>(bytes.size()),
                     format_hex_pretty(bytes).c_str());

  - id: uart_monitor_g2
    rx_pin:
      number: GPIO2
      mode:
        input: true
        pullup: false
        pulldown: false
    baud_rate: ${monitor_baud_rate}
    data_bits: ${monitor_data_bits}
    parity: ${monitor_parity}
    stop_bits: ${monitor_stop_bits}
    rx_buffer_size: 2048
    rx_full_threshold: 1
    rx_timeout: 1
    debug:
      direction: RX
      dummy_receiver: true
      after:
        bytes: ${monitor_chunk_size}
        timeout: ${monitor_frame_timeout}
      sequence:
        - lambda: |-
            const uint32_t sequence = ++id(capture_sequence);
            const uint32_t now = millis();
            id(g2_chunk_count)++;
            id(g2_byte_count) += bytes.size();
            modbus_capture::ring.push_uart(2, sequence, now, bytes);
            passive_modbus::monitor.feed(2, sequence, now, bytes);
            direct_mode_preview::direction_detector.feed(2, now, bytes);
            direct_mode_preview::direct_mode_gate.note_uart_activity(now);
            id(led_activity_until_ms) = now + 180;

            static const char HEX[] = "0123456789ABCDEF";
            std::string payload;
            payload.reserve(bytes.size() * 2);
            for (const uint8_t value : bytes) {
              payload.push_back(HEX[value >> 4]);
              payload.push_back(HEX[value & 0x0F]);
            }

            id(last_g2_chunk).publish_state(
              str_sprintf("boot=%u #%u %uB %s",
                          static_cast<unsigned>(id(capture_boot_id)),
                          static_cast<unsigned>(sequence),
                          static_cast<unsigned>(bytes.size()), payload.c_str())
            );
            ESP_LOGI("modbus_raw", "boot=%u #%u G2/GPIO2 %uB RAW_HEX=%s",
                     static_cast<unsigned>(id(capture_boot_id)),
                     static_cast<unsigned>(sequence),
                     static_cast<unsigned>(bytes.size()),
                     format_hex_pretty(bytes).c_str());

interval:
  # Physical monitor status on the AtomS3-Lite RGB LED:
  #   yellow slow blink = HA unavailable, captures are buffered locally
  #   green steady      = HA connected and monitor is ready
  #   cyan flash        = UART bytes were just captured on G1 or G2
  #   magenta fast blink= the fixed ring has overwritten at least one record
  - interval: 100ms
    then:
      - lambda: |-
          const uint32_t now = millis();
          passive_modbus::monitor.tick(now);
          direct_mode_preview::direct_mode_gate.tick(now);
          if (direct_mode_preview::direction_detector.detected()) {
            const uint8_t request_gpio =
              direct_mode_preview::direction_detector.request_source() == 1U
                ? 1U : 2U;
            const uint8_t response_gpio =
              direct_mode_preview::direction_detector.response_source() == 1U
                ? 1U : 2U;
            if (id(detected_request_gpio) != request_gpio ||
                id(detected_response_gpio) != response_gpio) {
              id(detected_request_gpio) = request_gpio;
              id(detected_response_gpio) = response_gpio;
              ESP_LOGW("direct_preview",
                       "Auto-detected future direction: TX candidate=GPIO%u, RX=GPIO%u; preview remains RX-only",
                       request_gpio, response_gpio);
            }
          }
          if (direct_mode_preview::direct_mode_gate.preview_ready() &&
              !id(direct_mode_preview_ready)) {
            id(direct_mode_preview_ready) = true;
            ESP_LOGW("direct_preview",
                     "30s UART idle gate latched. Preview remains physically RX-only with no TX path");
          }
          const bool activity =
            static_cast<int32_t>(id(led_activity_until_ms) - now) > 0;
          bool on = true;
          float red = 0.0f;
          float green = 0.0f;
          float blue = 0.0f;
          float brightness = 0.22f;
          int state = 0;

          if (modbus_capture::ring.overwritten_total() > 0) {
            state = 4;
            on = ((now / 250U) & 1U) == 0U;
            red = 1.0f;
            blue = 0.45f;
            brightness = 0.35f;
          } else if (activity) {
            state = 3;
            green = 0.75f;
            blue = 1.0f;
            brightness = 0.40f;
          } else if (id(ha_ready)) {
            state = 2;
            green = 1.0f;
          } else {
            state = 1;
            on = ((now / 500U) & 1U) == 0U;
            red = 1.0f;
            green = 0.45f;
            brightness = 0.28f;
          }

          const int signature = state * 2 + (on ? 1 : 0);
          if (signature == id(led_last_signature)) {
            return;
          }
          id(led_last_signature) = signature;

          if (!on) {
            auto call = id(monitor_status_led).turn_off();
            call.perform();
            return;
          }
          auto call = id(monitor_status_led).turn_on();
          call.set_rgb(red, green, blue);
          call.set_brightness(brightness);
          call.perform();

  # Send the ring front at least once per second until HA explicitly ACKs that
  # exact boot-session plus uint32 sequence after HA append completion.
  # Delivery is at-least-once; downstream storage deduplicates by both values.
  - interval: 20ms
    then:
      - if:
          condition:
            lambda: |-
              if (!id(ha_ready)) return false;
              if (!modbus_capture::ring.stage_front()) return false;
              const uint32_t now = millis();
              return id(capture_last_send_ms) == 0U ||
                id(capture_last_sent_sequence) !=
                  modbus_capture::ring.staged_sequence() ||
                static_cast<uint32_t>(now - id(capture_last_send_ms)) >= 1000U;
          then:
            - homeassistant.event:
                event: esphome.modbus_uart_capture
                data:
                  device: makeskybluemodbusmonitor
                data_template:
                  boot_id: "{{ boot_id }}"
                  record_type: "{{ record_type }}"
                  message: "{{ message }}"
                  source: "{{ source }}"
                  gpio: "{{ gpio }}"
                  sequence: "{{ sequence }}"
                  uptime_ms: "{{ uptime_ms }}"
                  byte_count: "{{ byte_count }}"
                  hex: "{{ hex_payload }}"
                  overwritten_total: "{{ overwritten_total }}"
                  buffer_remaining: "{{ buffer_remaining }}"
                variables:
                  boot_id: return id(capture_boot_id);
                  record_type: return modbus_capture::ring.staged_type();
                  message: |-
                    if (modbus_capture::ring.staged_type() == "BOOT") {
                      return std::string(
                        "BOOT: UART active before Wi-Fi; ring_capacity=256; "
                        "chunk_size=${monitor_chunk_size}; profile=${monitor_baud_rate}-8N1"
                      );
                    }
                    return std::string();
                  source: return modbus_capture::ring.staged_source();
                  gpio: return modbus_capture::ring.staged_gpio();
                  sequence: return modbus_capture::ring.staged_sequence();
                  uptime_ms: return modbus_capture::ring.staged_uptime_ms();
                  byte_count: return modbus_capture::ring.staged_length();
                  hex_payload: return modbus_capture::ring.staged_hex();
                  overwritten_total: |-
                    return modbus_capture::ring.staged_overwritten_total();
                  buffer_remaining: return modbus_capture::ring.size() - 1;
            - lambda: |-
                const uint32_t staged_sequence =
                  modbus_capture::ring.staged_sequence();
                if (id(capture_last_send_ms) != 0U &&
                    id(capture_last_sent_sequence) == staged_sequence) {
                  id(capture_retry_count)++;
                }
                id(capture_event_send_count)++;
                id(capture_last_sent_sequence) = staged_sequence;
                id(capture_last_send_ms) = millis();
