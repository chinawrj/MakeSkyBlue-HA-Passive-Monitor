substitutions:
  # Paths are supplied from the untracked secrets.yaml. This keeps the same
  # firmware reproducible without embedding this installation's absolute paths.
  wifi_config: !secret wifi_config
  wireguard_config: !secret wireguard_config
  # The existing MakeSkyBlue captures use Modbus RTU 9600-8N1. Change these
  # values only if the monitored UART uses a different serial profile.
  monitor_baud_rate: "9600"
  monitor_data_bits: "8"
  monitor_parity: NONE
  monitor_stop_bits: "1"
  # A Modbus RTU frame is separated by at least 3.5 character times. At 9600
  # baud, 8 ms is comfortably beyond that gap. A long frame is split into
  # ordered 96-byte chunks so the HA preview stays below 255 chars; hardware
  # FIFO loss and bounded-ring overwrite are exposed by separate diagnostics.
  monitor_frame_timeout: 8ms
  monitor_chunk_size: "96"

packages:
  passive_makeskyblue_entities: !include packages/makeskyblue-passive-entities.yaml

esphome:
  name: makeskybluemodbusmonitor
  friendly_name: MakeSkyBlueModbusMonitor
  project:
    name: rjwang.makeskyblue_modbus_monitor
    version: 0.1.0-alpha.7
  includes:
    - components/uart_capture_ring.h
    - components/passive_modbus_monitor.h
    - components/direct_mode_preview.h
  on_boot:
    # UART buses initialize at priority 1000. Insert BOOT immediately after
    # that, before Wi-Fi (priority 250) starts connecting.
    - priority: 900
      then:
        - lambda: |-
            direct_mode_preview::direct_mode_gate.restore(
              id(direct_mode_requested),
              id(direct_mode_preview_ready),
              millis());
            do {
              id(capture_boot_id) = esp_random();
            } while (id(capture_boot_id) == 0U);
            const uint32_t sequence = ++id(capture_sequence);
            id(boot_sequence) = sequence;
            id(boot_uptime_ms) = millis();
            modbus_capture::ring.push_boot(sequence, id(boot_uptime_ms));
            ESP_LOGW("modbus_buffer",
                     "BOOT session=%u buffered as seq=%u, ring capacity=%u records",
                     static_cast<unsigned>(id(capture_boot_id)),
                     static_cast<unsigned>(sequence),
                     static_cast<unsigned>(modbus_capture::CAPACITY));
    - priority: -100
      then:
        - lambda: |-
            id(onboard_boot_record).publish_state(str_sprintf(
              "session=%u #%u @%ums BOOT ring_capacity=%u chunk_size=${monitor_chunk_size} profile=${monitor_baud_rate}-8N1",
              static_cast<unsigned>(id(capture_boot_id)),
              static_cast<unsigned>(id(boot_sequence)),
              static_cast<unsigned>(id(boot_uptime_ms)),
              static_cast<unsigned>(modbus_capture::CAPACITY)
            ));
        - logger.log:
            level: WARN
            tag: modbus_monitor
            format: >-
              Passive UART monitor ready: G1=GPIO1 RX and G2=GPIO2 RX at
              ${monitor_baud_rate} baud; configured data/parity/stop settings apply;
              neither pin will transmit

esp32:
  variant: esp32s3
  flash_size: 8MB
  framework:
    type: esp-idf

logger:
  level: INFO
  # The installed monitor has no USB connection. Physical serial logging is
  # disabled; ESPHome logs remain available through the native API over Wi-Fi.
  baud_rate: 0
  tx_buffer_size: 8192
  logs:
    # Keep the live stream focused on captured UART bytes.
    sensor: WARN
    text_sensor: WARN

api:
  # Coalesce ordinary entity updates so they cannot crowd out raw capture
  # traffic. The capture path itself uses an explicit HA append-completion ACK.
  batch_delay: 50ms
  reboot_timeout: 0s
  # ESPHome 2026.7.0 validates this option at a maximum of 64.
  max_send_queue: 64
  encryption:
    key: !secret api_encryption_key
  actions:
    # HA calls this only after the File action and idempotency-helper update
    # complete. Until then the ring front remains staged and is retried.
    - action: ack_uart_capture
      variables:
        boot_id: string
        sequence: string
      then:
        - lambda: |-
            const auto parse_u32 = [](const std::string &value,
                                      uint32_t *parsed) -> bool {
              char *end = nullptr;
              errno = 0;
              const unsigned long long number =
                std::strtoull(value.c_str(), &end, 10);
              if (errno != 0 || end == value.c_str() || *end != '\0' ||
                  number > UINT32_MAX) {
                return false;
              }
              *parsed = static_cast<uint32_t>(number);
              return true;
            };
            uint32_t acknowledged_boot = 0U;
            uint32_t acknowledged_sequence = 0U;
            if (!parse_u32(boot_id, &acknowledged_boot) ||
                !parse_u32(sequence, &acknowledged_sequence)) {
              id(capture_ack_invalid_count)++;
              ESP_LOGW("modbus_buffer",
                       "Rejected invalid HA ACK boot_id=%s sequence=%s",
                       boot_id.c_str(), sequence.c_str());
              return;
            }
            if (acknowledged_boot != id(capture_boot_id) ||
                !modbus_capture::ring.acknowledge_staged(
                  acknowledged_sequence)) {
              id(capture_ack_mismatch_count)++;
              ESP_LOGW("modbus_buffer",
                       "Rejected stale/mismatched HA ACK session=%u seq=%u staged=%u",
                       static_cast<unsigned>(acknowledged_boot),
                       static_cast<unsigned>(acknowledged_sequence),
                       static_cast<unsigned>(
                         modbus_capture::ring.has_staged()
                           ? modbus_capture::ring.staged_sequence() : 0U));
              return;
            }
            id(capture_ack_count)++;
            id(capture_last_acked_sequence) = acknowledged_sequence;
            id(capture_last_send_ms) = 0;
  on_client_connected:
    - if:
        condition:
          lambda: return client_info.find("Home Assistant") != std::string::npos;
        then:
          - lambda: |-
              id(ha_ready) = false;
              id(ha_generation)++;
              id(ha_pending_generation) = id(ha_generation);
          # HA subscribes to ESPHome actions shortly after API authentication.
          - delay: 2s
          - lambda: |-
              if (id(ha_pending_generation) == id(ha_generation)) {
                id(ha_ready) = true;
                ESP_LOGI("modbus_buffer",
                         "Home Assistant ready; draining %u buffered record(s)",
                         static_cast<unsigned>(modbus_capture::ring.size()));
              }
  on_client_disconnected:
    - if:
        condition:
          lambda: return client_info.find("Home Assistant") != std::string::npos;
        then:
          - lambda: |-
              id(ha_generation)++;
              id(ha_ready) = false;
              ESP_LOGW("modbus_buffer",
                       "Home Assistant disconnected; buffering locally");

ota:
  - platform: esphome
    password: !secret ota_password

wifi: !include ${wifi_config}

captive_portal:

# WireGuard starts only after SNTP has supplied valid wall-clock time. UART
# capture and the RAM ring are already active at that point.
time:
  - platform: sntp
    id: monitor_sntp_time
    timezone: Asia/Shanghai

wireguard: !include ${wireguard_config}

globals:
  - id: capture_boot_id
    type: uint32_t
    restore_value: no
    initial_value: "0"
  - id: capture_sequence
    type: uint32_t
    restore_value: no
    initial_value: "0"
  - id: boot_sequence
    type: uint32_t
    restore_value: no
    initial_value: "0"
  - id: boot_uptime_ms
    type: uint32_t
    restore_value: no
    initial_value: "0"
  - id: ha_generation
    type: uint32_t
    restore_value: no
    initial_value: "0"
  - id: ha_pending_generation
    type: uint32_t
    restore_value: no
    initial_value: "0"
  - id: ha_ready
    type: bool
    restore_value: no
    initial_value: "false"
  - id: capture_last_send_ms
    type: uint32_t
    restore_value: no
    initial_value: "0"
  - id: capture_last_sent_sequence
    type: uint32_t
    restore_value: no
    initial_value: "0"
  - id: capture_event_send_count
    type: uint32_t
    restore_value: no
    initial_value: "0"
  - id: capture_retry_count
    type: uint32_t
    restore_value: no
    initial_value: "0"
  - id: capture_ack_count
    type: uint32_t
    restore_value: no
    initial_value: "0"
  - id: capture_ack_mismatch_count
    type: uint32_t
    restore_value: no
    initial_value: "0"
  - id: capture_ack_invalid_count
    type: uint32_t
    restore_value: no
    initial_value: "0"
  - id: capture_last_acked_sequence
    type: uint32_t
    restore_value: no
    initial_value: "0"
  - id: led_activity_until_ms
    type: uint32_t
    restore_value: no
    initial_value: "0"
  - id: led_last_signature
    type: int
    restore_value: no
    initial_value: "-1"
  - id: g1_chunk_count
    type: uint32_t
    restore_value: no
    initial_value: "0"
  - id: g2_chunk_count
    type: uint32_t
    restore_value: no
    initial_value: "0"
  - id: g1_byte_count
    type: uint64_t
    restore_value: no
    initial_value: "0"
  - id: g2_byte_count
    type: uint64_t
    restore_value: no
    initial_value: "0"
  # Preview-only one-way state. Once requested or ready becomes true it is
  # never cleared by HA. The preview firmware still has no TX pin or write API.
  - id: direct_mode_requested
    type: bool
    restore_value: yes
    initial_value: "false"
  - id: direct_mode_preview_ready
    type: bool
    restore_value: yes
    initial_value: "false"
  - id: detected_request_gpio
    type: uint8_t
    restore_value: yes
    initial_value: "0"
  - id: detected_response_gpio
    type: uint8_t
    restore_value: yes
    initial_value: "0"

# AtomS3-Lite onboard WS2812C RGB status indicator. It is kept internal so a
# Home Assistant light command cannot mask monitor health/activity states.
light:
  - platform: esp32_rmt_led_strip
    id: monitor_status_led
    internal: true
    pin: GPIO35
    num_leds: 1
    chipset: WS2812
    rgb_order: GRB
    rmt_symbols: 48
    default_transition_length: 0s
    restore_mode: ALWAYS_OFF

text_sensor:
  - platform: wireguard
    wireguard_id: makeskyblue_monitor_wireguard
    address:
      name: "WireGuard Address"
  - platform: template
    id: onboard_boot_record
    name: "Onboard Boot Record"
    icon: mdi:restart-alert
    entity_category: diagnostic
    update_interval: never
  - platform: template
    name: "Direct Mode Preview State"
    icon: mdi:transit-connection-variant
    entity_category: diagnostic
    update_interval: 2s
    lambda: return direct_mode_preview::direct_mode_gate.state();
  - platform: template
    name: "Detected Future TX Pin"
    icon: mdi:serial-port
    entity_category: diagnostic
    update_interval: 5s
    lambda: |-
      uint8_t gpio = id(detected_request_gpio);
      if (direct_mode_preview::direction_detector.detected()) {
        gpio = direct_mode_preview::direction_detector.request_source() == 1U
                 ? 1U : 2U;
      }
      if (gpio == 0U) return std::string("undetected");
      return str_sprintf("GPIO%u (request line; preview only)", gpio);
  - platform: template
    name: "Detected Future RX Pin"
    icon: mdi:serial-port
    entity_category: diagnostic
    update_interval: 5s
    lambda: |-
      uint8_t gpio = id(detected_response_gpio);
      if (direct_mode_preview::direction_detector.detected()) {
        gpio = direct_mode_preview::direction_detector.response_source() == 1U
                 ? 1U : 2U;
      }
      if (gpio == 0U) return std::string("undetected");
      return str_sprintf("GPIO%u (response line)", gpio);
  - platform: template
    name: "Direct Mode Preview Safety"
    icon: mdi:shield-lock
    entity_category: diagnostic
    update_interval: 60s
    lambda: return {"PREVIEW_ONLY_NO_TX_COMPILED"};
  - platform: template
    name: "UART Capture Boot Session ID"
    icon: mdi:identifier
    entity_category: diagnostic
    update_interval: 60s
    lambda: return str_sprintf("%u", static_cast<unsigned>(id(capture_boot_id)));
  - platform: template
    id: last_g1_chunk
    name: "G1 Last UART Chunk"
    icon: mdi:code-braces
    entity_category: diagnostic
    update_interval: never
  - platform: template
    id: last_g2_chunk
    name: "G2 Last UART Chunk"
    icon: mdi:code-braces
    entity_category: diagnostic
    update_interval: never
  - platform: template
    name: "Last Parsed Modbus Frame"
    icon: mdi:code-json
    entity_category: diagnostic
    update_interval: 2s
    lambda: return passive_modbus::monitor.last_frame_summary();
  - platform: template
    name: "Observed Modbus Communication Addresses"
    icon: mdi:identifier
    entity_category: diagnostic
    update_interval: 10s
    lambda: |-
      const std::string value = passive_modbus::monitor.observed_slave_addresses();
      if (value.empty()) return {};
      return value;
  - platform: template
    name: "D30-D31 observed_network_time"
    icon: mdi:clock-check-outline
    entity_category: diagnostic
    update_interval: 10s
    lambda: |-
      if (!passive_modbus::monitor.has_network_time()) return {};
      const uint32_t value = passive_modbus::monitor.last_network_time_raw();
      const unsigned year = 2024U + ((value >> 26U) & 0x3FU);
      const unsigned month = (value >> 22U) & 0x0FU;
      const unsigned day = (value >> 17U) & 0x1FU;
      const unsigned hour = (value >> 12U) & 0x1FU;
      const unsigned minute = (value >> 6U) & 0x3FU;
      const unsigned second = value & 0x3FU;
      return str_sprintf("%04u-%02u-%02u %02u:%02u:%02u", year, month,
                         day, hour, minute, second);

sensor:
  - platform: wireguard
    wireguard_id: makeskyblue_monitor_wireguard
    latest_handshake:
      name: "WireGuard Latest Handshake"
  - platform: template
    name: "G1 Captured Bytes"
    icon: mdi:counter
    entity_category: diagnostic
    accuracy_decimals: 0
    update_interval: 30s
    lambda: return static_cast<double>(id(g1_byte_count));
  - platform: template
    name: "G2 Captured Bytes"
    icon: mdi:counter
    entity_category: diagnostic
    accuracy_decimals: 0
    update_interval: 30s
    lambda: return static_cast<double>(id(g2_byte_count));
  - platform: template
    name: "G1 Captured Chunks"
    icon: mdi:counter
    entity_category: diagnostic
    accuracy_decimals: 0
    update_interval: 30s
    lambda: return id(g1_chunk_count);
  - platform: template
    name: "G2 Captured Chunks"
    icon: mdi:counter
    entity_category: diagnostic
    accuracy_decimals: 0
    update_interval: 30s
    lambda: return id(g2_chunk_count);
  - platform: template
    name: "UART Ring Buffered Records"
    icon: mdi:database-clock
    entity_category: diagnostic
    accuracy_decimals: 0
    update_interval: 30s
    lambda: return modbus_capture::ring.size();
  - platform: template
    name: "UART Ring Overwritten Records"
    icon: mdi:database-alert
    entity_category: diagnostic
    accuracy_decimals: 0
    update_interval: 30s
    lambda: return modbus_capture::ring.overwritten_total();
  - platform: template
    name: "Parsed G1 Request Frames"
    icon: mdi:counter
    entity_category: diagnostic
    accuracy_decimals: 0
    update_interval: 30s
    lambda: return passive_modbus::monitor.g1_frames();
  - platform: template
    name: "Parsed G2 Response Frames"
    icon: mdi:counter
    entity_category: diagnostic
    accuracy_decimals: 0
    update_interval: 30s
    lambda: return passive_modbus::monitor.g2_frames();
  - platform: template
    name: "Parsed Register Words"
    icon: mdi:database-eye
    entity_category: diagnostic
    accuracy_decimals: 0
    update_interval: 30s
    lambda: return passive_modbus::monitor.parsed_register_words();
  - platform: template
    name: "Last Modbus Communication Address"
    icon: mdi:numeric
    entity_category: diagnostic
    accuracy_decimals: 0
    update_interval: 10s
    lambda: |-
      const uint8_t address = passive_modbus::monitor.last_slave_address();
      if (address == 0U) return {};
      return static_cast<float>(address);
  - platform: template
    name: "Observed Modbus Communication Address Count"
    icon: mdi:counter
    entity_category: diagnostic
    accuracy_decimals: 0
    update_interval: 30s
    lambda: return passive_modbus::monitor.observed_slave_address_count();
  - platform: template
    name: "Valid Register Addresses"
    icon: mdi:database-check
    entity_category: diagnostic
    accuracy_decimals: 0
    update_interval: 30s
    lambda: return passive_modbus::monitor.valid_register_count();
  - platform: template
    name: "Confirmed Semantic Register Addresses"
    icon: mdi:database-check-outline
    entity_category: diagnostic
    accuracy_decimals: 0
    update_interval: 60s
    lambda: return 67;
  - platform: template
    name: "Provisional Semantic Register Addresses"
    icon: mdi:database-clock-outline
    entity_category: diagnostic
    accuracy_decimals: 0
    update_interval: 60s
    lambda: return 18;
  - platform: template
    name: "Raw-only Register Addresses"
    icon: mdi:database-eye-outline
    entity_category: diagnostic
    accuracy_decimals: 0
    update_interval: 60s
    lambda: return 93;
  - platform: template
    name: "Unresolved Semantic Register Addresses"
    icon: mdi:database-alert-outline
    entity_category: diagnostic
    accuracy_decimals: 0
    update_interval: 60s
    lambda: return 111;
  - platform: template
    name: "Confirmed Register Semantic Coverage"
    icon: mdi:percent-circle-outline
    entity_category: diagnostic
    unit_of_measurement: "%"
    accuracy_decimals: 1
    update_interval: 60s
    lambda: return 100.0f * 67.0f / 178.0f;
  - platform: template
    name: "ESP32 Free Heap"
    icon: mdi:memory
    entity_category: diagnostic
    unit_of_measurement: "B"
    accuracy_decimals: 0
    update_interval: 30s
    lambda: return heap_caps_get_free_size(MALLOC_CAP_8BIT);
  - platform: template
    name: "ESP32 Minimum Free Heap"
    icon: mdi:memory-arrow-down
    entity_category: diagnostic
    unit_of_measurement: "B"
    accuracy_decimals: 0
    update_interval: 30s
    lambda: return heap_caps_get_minimum_free_size(MALLOC_CAP_8BIT);
  - platform: template
    name: "ESP32 Largest Free Heap Block"
    icon: mdi:memory
    entity_category: diagnostic
    unit_of_measurement: "B"
    accuracy_decimals: 0
    update_interval: 30s
    lambda: return heap_caps_get_largest_free_block(MALLOC_CAP_8BIT);
  - platform: template
    name: "Wi-Fi Module Startup Markers"
    icon: mdi:restart-alert
    entity_category: diagnostic
    accuracy_decimals: 0
    update_interval: 30s
    lambda: return passive_modbus::monitor.wifi_module_startup_markers();
  - platform: template
    name: "Observed UART Writes"
    icon: mdi:eye-arrow-right-outline
    entity_category: diagnostic
    accuracy_decimals: 0
    update_interval: 30s
    lambda: return passive_modbus::monitor.observed_writes();
  - platform: template
    name: "FC06 Last D Register Address"
    icon: mdi:database-marker-outline
    entity_category: diagnostic
    accuracy_decimals: 0
    update_interval: 30s
    lambda: return passive_modbus::monitor.last_fc06_register();
  - platform: template
    name: "FC06 Last Write Value U16"
    icon: mdi:database-arrow-right-outline
    entity_category: diagnostic
    accuracy_decimals: 0
    update_interval: 30s
    lambda: return passive_modbus::monitor.last_fc06_write_value();
  - platform: template
    name: "FC06 Last Response Value U16"
    icon: mdi:database-arrow-left-outline
    entity_category: diagnostic
    accuracy_decimals: 0
    update_interval: 30s
    lambda: return passive_modbus::monitor.last_fc06_response_value();
  - platform: template
    name: "FC06 Parsed Transactions"
    icon: mdi:swap-horizontal-bold
    entity_category: diagnostic
    accuracy_decimals: 0
    update_interval: 30s
    lambda: return passive_modbus::monitor.fc06_transactions();
  - platform: template
